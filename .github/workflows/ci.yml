name: ci

on:
    push:
        branches:
            - master
            - develop
            - ci
    pull_request:
        branches:
            - master

permissions:
    contents: read

jobs:
    php-baseline:
        name: Conventional PHP baseline
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: dom, gmp
                  php-version: "8.2"
                  tools: composer:v2

            - name: Validate Composer files
              run: composer validate --strict

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-8.2-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.2-composer-
                      ${{ runner.os }}-php-composer-

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Check whitespace
              run: composer check:whitespace

            - name: Run PHP-CS-Fixer
              run: composer cs

            - name: Run PHPStan
              run: composer analyse -- --error-format=raw

            - name: Run PHPUnit
              run: |
                  mkdir -p build/test-results
                  composer test -- --colors=never --log-junit build/test-results/phpunit.xml

            - name: Upload PHPUnit report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: phpunit-conventional-php82
                  path: build/test-results/phpunit.xml
                  if-no-files-found: warn

    lowest-dependencies:
        name: Lowest dependencies / PHP 8.2
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: dom, gmp
                  php-version: "8.2"
                  tools: composer:v2

            - name: Validate Composer files
              run: composer validate --strict

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-8.2-composer-lowest-${{ hashFiles('composer.json') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.2-composer-lowest-
                      ${{ runner.os }}-php-8.2-composer-
                      ${{ runner.os }}-php-composer-

            - name: Install lowest supported dependencies
              run: .github/scripts/update-supported-dependencies lowest

            - name: Run PHPStan
              run: composer analyse -- --error-format=raw

            - name: Run PHPUnit
              run: |
                  mkdir -p build/test-results
                  composer test -- --colors=never --log-junit build/test-results/phpunit.xml

            - name: Upload PHPUnit report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: phpunit-lowest-php82
                  path: build/test-results/phpunit.xml
                  if-no-files-found: warn

    highest-dependencies:
        name: Highest dependencies / PHP 8.5
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: dom, gmp
                  ini-values: memory_limit=512M
                  php-version: "8.5"
                  tools: composer:v2

            - name: Validate Composer files
              run: composer validate --strict

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-8.5-composer-highest-${{ hashFiles('composer.json') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.5-composer-highest-
                      ${{ runner.os }}-php-8.5-composer-
                      ${{ runner.os }}-php-composer-

            - name: Install highest supported dependencies
              run: .github/scripts/update-supported-dependencies highest

            - name: Run PHPStan
              run: composer analyse -- --error-format=raw

            - name: Run PHPUnit
              run: |
                  mkdir -p build/test-results
                  composer test -- --colors=never --log-junit build/test-results/phpunit.xml

            - name: Upload PHPUnit report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: phpunit-highest-php85
                  path: build/test-results/phpunit.xml
                  if-no-files-found: warn

    api-compatibility:
        name: API compatibility
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: bcmath, dom, intl, mbstring, simplexml, sodium
                  php-version: "8.2"
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key:
                      ${{ runner.os }}-php-8.2-composer-api-compatibility-${{
                      hashFiles('tools/api-compatibility/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.2-composer-api-compatibility-
                      ${{ runner.os }}-php-8.2-composer-
                      ${{ runner.os }}-php-composer-

            - name: Install API compatibility tool
              run: composer --working-dir=tools/api-compatibility install --prefer-dist --no-interaction --no-progress

            - name: Check API compatibility
              run: tools/api-compatibility/vendor/bin/roave-backward-compatibility-check --format=github-actions
