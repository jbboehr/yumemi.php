name: ci

on:
    push:
        branches:
            - master
            - develop
            - ci
    pull_request:
        branches:
            - master

permissions:
    contents: read

jobs:
    nix:
        name: Nix
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install Nix
              uses: cachix/install-nix-action@v31
              with:
                  github_access_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Restore and save Nix store
              uses: nix-community/cache-nix-action@v7
              with:
                  primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
                  restore-prefixes-first-match: nix-${{ runner.os }}-
                  gc-max-store-size-linux: 2G

            - name: Check flake
              run: nix flake check --print-build-logs

    php:
        name: PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-version:
                    - "8.2"
                    - "8.3"
                    - "8.4"
                    - "8.5"
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: pcov
                  extensions: dom, gmp
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2

            - name: Validate Composer files
              run: composer validate --strict

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-composer-

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Check whitespace
              run: git diff --check

            - name: Run PHP-CS-Fixer
              if: matrix.php-version == '8.2'
              run: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.dist.php --dry-run --diff

            - name: Run PHPStan
              run: vendor/bin/phpstan analyse --no-progress --error-format=raw

            - name: Run PHPUnit
              run: vendor/bin/phpunit --colors=never

            - name: Smoke-test benchmarks
              if: matrix.php-version == '8.2'
              run: composer benchmark:smoke

            - name: Smoke-test packaged consumer
              if: matrix.php-version == '8.2'
              run: composer test:consumer:archive

    mutation:
        name: Mutation testing
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: pcov
                  extensions: dom, gmp
                  php-version: "8.2"
                  tools: composer:v2

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Run mutation tests
              run: composer infection:ci

            - name: Upload mutation reports
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: infection-reports
                  path: |
                      infection.log
                      infection-summary.log
                  if-no-files-found: warn

    illuminate-cache:
        name: Illuminate Cache ${{ matrix.illuminate-version }} / PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - illuminate-version: "11"
                      package-mode: source
                      php-version: "8.2"
                    - illuminate-version: "12"
                      package-mode: archive
                      php-version: "8.2"
                    - illuminate-version: "13"
                      package-mode: source
                      php-version: "8.3"
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: gmp
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-illuminate-cache-${{ matrix.illuminate-version }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-illuminate-cache-
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-composer-

            - name: Test package stubs
              run: tests/Consumer/run ${{ matrix.package-mode }} illuminate-cache ${{ matrix.illuminate-version }}

    illuminate-http:
        name: Illuminate HTTP ${{ matrix.illuminate-version }} / PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - illuminate-version: "11"
                      package-mode: source
                      php-version: "8.2"
                    - illuminate-version: "12"
                      package-mode: archive
                      php-version: "8.2"
                    - illuminate-version: "13"
                      package-mode: source
                      php-version: "8.3"
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: gmp
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-illuminate-http-${{ matrix.illuminate-version }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-illuminate-http-
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-composer-

            - name: Test package stubs
              run: tests/Consumer/run ${{ matrix.package-mode }} illuminate-http ${{ matrix.illuminate-version }}
